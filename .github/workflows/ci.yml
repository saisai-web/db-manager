# 設計書「テストと配布」: 最初から Mac と Windows の両方でビルドし、
# DB の結合テストは実際の DB サーバーを使う Linux ランナーで行う。
#
# 注意: このファイルは、まだ GitHub Actions 上で実行して確かめていない(サービスコンテナの
# ヘルスチェックの書き方は、手元の Docker では確かめられていない)。
# SSH のテストは /usr/sbin/sshd を使う(Ubuntu の openssh-server)。無ければ飛ばす。
name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # core 以下(UI を除く)のビルドとテスト。結合テストは Linux のジョブで行うため、
  # ここでは DB がなければ飛ばす。
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  # macOS x64 は、arm64 のランナーからクロスチェックする。
  check-macos-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --target x86_64-apple-darwin

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Sqltool_Test_1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Sqltool_Test_1 -Q 'select 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      oracle:
        image: gvenzl/oracle-free:slim-faststart
        env:
          ORACLE_PASSWORD: Sqltool_Test_1
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      SQLTOOL_TEST_ORACLE_HOST: 127.0.0.1
      SQLTOOL_TEST_ORACLE_PORT: "1521"
      SQLTOOL_TEST_ORACLE_USER: system
      SQLTOOL_TEST_ORACLE_PASSWORD: Sqltool_Test_1
      SQLTOOL_TEST_ORACLE_SERVICE: FREEPDB1
      SQLTOOL_REQUIRE_ORACLE: "1"
      SQLTOOL_TEST_MSSQL_HOST: 127.0.0.1
      SQLTOOL_TEST_MSSQL_PORT: "1433"
      SQLTOOL_TEST_MSSQL_USER: sa
      SQLTOOL_TEST_MSSQL_PASSWORD: Sqltool_Test_1
      SQLTOOL_REQUIRE_MSSQL: "1"
      SQLTOOL_TEST_MYSQL_HOST: 127.0.0.1
      SQLTOOL_TEST_MYSQL_PORT: "3306"
      SQLTOOL_TEST_MYSQL_USER: root
      SQLTOOL_REQUIRE_MYSQL: "1"
      SQLTOOL_TEST_PG_HOST: localhost
      SQLTOOL_TEST_PG_PORT: "5432"
      SQLTOOL_TEST_PG_USER: postgres
      SQLTOOL_TEST_PG_PASSWORD: postgres
      # DB を用意できなければ、テストを飛ばさず失敗させる
      SQLTOOL_REQUIRE_PG: "1"
      # 4 つの DB イメージとワークスペース全体のビルドでディスクが足りなくなるため、デバッグ情報は出さない
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      # 使わない大きな既定ツールを消して、空き容量を確保する
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # 画面(app)のテストは、GPUI の描画に必要なシステムライブラリを入れてから
      - run: sudo apt-get update && sudo apt-get install -y openssh-server libxkbcommon-x11-dev libwayland-dev libasound2-dev libfontconfig-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  # MariaDB は MySQL とドライバを共有するが、実行計画などサーバーで挙動が変わる。別の DB として確かめる。
  integration-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SQLTOOL_TEST_MYSQL_HOST: 127.0.0.1
      SQLTOOL_TEST_MYSQL_PORT: "3306"
      SQLTOOL_TEST_MYSQL_USER: root
      SQLTOOL_REQUIRE_MYSQL: "1"
      SQLTOOL_TRACE_EVENTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y openssh-server
      - run: cargo test -p driver-mysql -p test-mysql
      - run: cargo test -p sqltool-core --test e2e -- mysql
