[package]
name = "data-io"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "CSV / Excel の書き出しと、CSV の読み取り(DB に依存しない)"

[lints]
workspace = true

[dependencies]
csv = "1.4.0"
encoding_rs = "0.8.44"
rust_xlsxwriter = { version = "0.102.0", features = ["constant_memory"] }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "9.2.2", features = ["deflate"] }
